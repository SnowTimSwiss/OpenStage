name: Release Build

# `release: published` always runs the workflow from the *tag*, so a broken
# workflow can only be fixed by cutting a new release. `workflow_dispatch`
# lets an existing tag be rebuilt with the workflow from the selected branch.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build assets for, e.g. v2.0.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  APP_NAME: openstage
  # Tag the assets are attached to. `release` events carry it, manual runs pass
  # it as an input.
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # Headless LibreOffice bundled into every installer so PPTX import works
  # with nothing for the user to install. Only the release branch is pinned
  # here; the newest available patch release inside that branch is resolved
  # at build time (see resolve-libreoffice). Pinning an exact patch version
  # is not stable: the Document Foundation prunes superseded point releases
  # from /libreoffice/stable/, which turns a hardcoded patch into a 404.
  # Bump the branch deliberately; each resolved patch invalidates the LO
  # download caches below.
  LIBREOFFICE_BRANCH: '26.8'

jobs:
  resolve-libreoffice:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve newest LibreOffice patch in pinned branch
        id: resolve
        run: |
          set -euo pipefail
          branch="$LIBREOFFICE_BRANCH"
          listing=$(curl -fsSL --retry 3 https://download.documentfoundation.org/libreoffice/stable/)
          version=$(printf '%s\n' "$listing" \
            | grep -oE "href=\"${branch//./\\.}\.[0-9]+/" \
            | sed -E 's#href="##; s#/$##' \
            | sort -V | tail -n1 || true)
          if [ -z "$version" ]; then
            echo "No LibreOffice release matching ${branch}.x found in /libreoffice/stable/" >&2
            echo "Set LIBREOFFICE_BRANCH to a branch that still has releases." >&2
            exit 1
          fi
          echo "Resolved LibreOffice $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-windows:
    runs-on: windows-latest
    needs: resolve-libreoffice
    timeout-minutes: 90
    env:
      LIBREOFFICE_VERSION: ${{ needs.resolve-libreoffice.outputs.version }}
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Cache staged LibreOffice
        id: lo-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/libreoffice
          key: libreoffice-windows-x64-${{ env.LIBREOFFICE_VERSION }}

      - name: Check cached LibreOffice is complete
        id: lo-verify
        shell: pwsh
        run: |
          $ok = Test-Path "src-tauri\resources\libreoffice\program\soffice.exe"
          "complete=$($ok.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Download and stage LibreOffice (Windows)
        if: steps.lo-verify.outputs.complete != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:LIBREOFFICE_VERSION
          $url = "https://download.documentfoundation.org/libreoffice/stable/$version/win/x86_64/LibreOffice_${version}_Win_x86-64.msi"
          $msiPath = "$env:RUNNER_TEMP\libreoffice.msi"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $msiPath

          # Administrative install extracts the MSI's file layout without
          # registering the app or needing elevation for a real install.
          $extractDir = "$env:RUNNER_TEMP\lo-extract"
          msiexec.exe /a "$msiPath" /qn TARGETDIR="$extractDir" | Out-Null

          $stageDir = "src-tauri\resources\libreoffice"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          # The admin image nests the real tree under
          # "...\LibreOffice\<version-ish>\program" etc. Find the "program"
          # directory produced by the extraction and stage its parent.
          $programDir = Get-ChildItem -Path $extractDir -Recurse -Directory -Filter "program" | Select-Object -First 1
          if (-not $programDir) {
            throw "Could not locate LibreOffice 'program' directory in extracted MSI"
          }
          $sourceRoot = $programDir.Parent.FullName
          Copy-Item -Path "$sourceRoot\*" -Destination $stageDir -Recurse -Force

          if (-not (Test-Path "$stageDir\program\soffice.exe")) {
            throw "Staged LibreOffice is missing program\soffice.exe"
          }
          Write-Host "Staged LibreOffice at $stageDir"

      - name: Build Tauri App
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package portable build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # A bare .exe has no resources next to it, and that is exactly where
          # resource_dir() looks on Windows - so the portable build has to ship
          # the bundled LibreOffice alongside the executable.
          $dir = "$env:RUNNER_TEMP\portable"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Get-ChildItem "src-tauri\target\release\*.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "No application executable found in target\release" }
          Copy-Item $exe.FullName "$dir\$($exe.Name)"
          Copy-Item "src-tauri\resources\libreoffice" "$dir\libreoffice" -Recurse

          $zip = Join-Path $env:GITHUB_WORKSPACE "$env:APP_NAME-$($env:RELEASE_TAG)-windows-x64-portable.zip"
          Push-Location $dir
          try {
            if (Get-Command 7z.exe -ErrorAction SilentlyContinue) {
              # Much faster than Compress-Archive for ~1 GB of binaries.
              & 7z.exe a -tzip -mx=3 $zip "*" | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }
            } else {
              Compress-Archive -Path * -DestinationPath $zip
            }
          } finally {
            Pop-Location
          }
          if (-not (Test-Path $zip)) { throw "Failed to create $zip" }
          Write-Host "Created $zip"

      - name: Collect release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "release-assets"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $tag = $env:RELEASE_TAG

          $msi = Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" | Select-Object -First 1
          if (-not $msi) { throw "No MSI bundle was produced" }
          Copy-Item $msi.FullName "$out\$env:APP_NAME-$($tag)-windows-x64-installer.msi"

          $setup = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (-not $setup) { throw "No NSIS bundle was produced" }
          Copy-Item $setup.FullName "$out\$env:APP_NAME-$($tag)-windows-x64-setup.exe"

          Copy-Item "$env:GITHUB_WORKSPACE\$env:APP_NAME-$($tag)-windows-x64-portable.zip" $out
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload Windows assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    needs: resolve-libreoffice
    timeout-minutes: 120
    env:
      LIBREOFFICE_VERSION: ${{ needs.resolve-libreoffice.outputs.version }}
      # Flatpak runtime the app is packaged against. org.gnome.Platform ships
      # the GTK3 stack + WebKitGTK 4.1 that Tauri links against.
      FLATPAK_RUNTIME_VERSION: '50'
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      # The Flatpak manifest lives in the repo, so a tag that predates it would
      # not have one. Packaging files are therefore always taken from the ref
      # this workflow runs from (main), not from the tag being built.
      - name: Checkout packaging files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci-packaging

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            flatpak \
            flatpak-builder \
            rpm

      - name: Install dependencies
        run: npm ci

      - name: Cache staged LibreOffice
        id: lo-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/libreoffice
          key: libreoffice-linux-x86_64-${{ env.LIBREOFFICE_VERSION }}

      - name: Check cached LibreOffice is complete
        id: lo-verify
        run: |
          if [ -e "src-tauri/resources/libreoffice/program/soffice" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and stage LibreOffice (Linux)
        if: steps.lo-verify.outputs.complete != 'true'
        run: |
          set -euo pipefail
          version="$LIBREOFFICE_VERSION"
          url="https://download.documentfoundation.org/libreoffice/stable/${version}/deb/x86_64/LibreOffice_${version}_Linux_x86-64_deb.tar.gz"
          archive_path="$RUNNER_TEMP/libreoffice.tar.gz"
          echo "Downloading $url"
          curl -fsSL "$url" -o "$archive_path"

          extract_dir="$RUNNER_TEMP/lo-extract"
          mkdir -p "$extract_dir"
          tar -xzf "$archive_path" -C "$extract_dir"

          # The archive contains one top-level dir (LibreOffice_*_Linux_x86-64_deb)
          # with a DEBS/ subfolder of individual .deb packages. Extract each
          # into the staging dir without installing them system-wide.
          debs_dir=$(find "$extract_dir" -maxdepth 2 -type d -name "DEBS" | head -n1)
          if [ -z "$debs_dir" ]; then
            echo "Could not locate DEBS directory in extracted archive" >&2
            exit 1
          fi

          stage_dir="$GITHUB_WORKSPACE/src-tauri/resources/libreoffice"
          mkdir -p "$stage_dir"
          for deb in "$debs_dir"/*.deb; do
            dpkg-deb -x "$deb" "$stage_dir/root"
          done

          # dpkg-deb preserves the package's install path
          # (opt/libreofficeXX/program/soffice); flatten it so
          # resources/libreoffice/program/soffice is stable regardless of
          # the version-numbered subdirectory LibreOffice installs into.
          lo_opt_dir=$(find "$stage_dir/root/opt" -maxdepth 1 -type d -iname "libreoffice*" | head -n1)
          if [ -z "$lo_opt_dir" ]; then
            echo "Could not locate opt/libreoffice* after extracting .deb packages" >&2
            exit 1
          fi
          shopt -s dotglob
          mv "$lo_opt_dir"/* "$stage_dir/"
          shopt -u dotglob
          rm -rf "$stage_dir/root"

          chmod +x "$stage_dir/program/soffice.bin" "$stage_dir/program/soffice" 2>/dev/null || true

          if [ ! -e "$stage_dir/program/soffice" ]; then
            echo "Staged LibreOffice is missing program/soffice" >&2
            exit 1
          fi
          echo "Staged LibreOffice at $stage_dir"

      - name: Build Tauri App
        run: npm run tauri build -- --bundles deb,rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Flatpak runtime
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub \
            "org.gnome.Platform//${FLATPAK_RUNTIME_VERSION}" \
            "org.gnome.Sdk//${FLATPAK_RUNTIME_VERSION}"

      - name: Stage Flatpak tree from the .deb
        run: |
          set -euo pipefail
          # Packaging the already-built .deb keeps the Flatpak byte-identical to
          # the deb/rpm builds (same binary, same bundled LibreOffice) instead of
          # compiling a second time inside the sandbox.
          pkg="$GITHUB_WORKSPACE/.ci-packaging/flatpak"
          extract_dir="$RUNNER_TEMP/deb-extract"
          rm -rf "$extract_dir" "$pkg/stage"
          mkdir -p "$extract_dir" "$pkg/stage"
          dpkg-deb -x src-tauri/target/release/bundle/deb/*.deb "$extract_dir"
          cp -a "$extract_dir/usr/." "$pkg/stage/"

          if [ ! -x "$pkg/stage/bin/openstage" ]; then
            echo "Extracted .deb has no bin/openstage - cannot build Flatpak" >&2
            exit 1
          fi
          du -sh "$pkg/stage"

      - name: Build Flatpak bundle
        run: |
          set -euo pipefail
          pkg="$GITHUB_WORKSPACE/.ci-packaging/flatpak"
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo="$pkg/repo" "$pkg/build" "$pkg/dev.openstage.app.yml"
          flatpak build-bundle "$pkg/repo" \
            "$APP_NAME-$RELEASE_TAG-linux-x86_64.flatpak" dev.openstage.app
          ls -lh "$APP_NAME-$RELEASE_TAG-linux-x86_64.flatpak"

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/deb/*.deb "release-assets/$APP_NAME-$RELEASE_TAG-linux-amd64.deb"
          cp src-tauri/target/release/bundle/rpm/*.rpm "release-assets/$APP_NAME-$RELEASE_TAG-linux-x86_64.rpm"
          cp "$APP_NAME-$RELEASE_TAG-linux-x86_64.flatpak" release-assets/
          ls -lh release-assets

      - name: Upload Linux assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
